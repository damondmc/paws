[project]
name = "paws"
version = "1.0.0"
description = "Python Automation for Weave Searches - manages Condor jobs and analysis for directed CW searches using WEAVE"
authors = [{ name = "Damon Cheung", email = "damoncht@umich.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "astropy",
    "tqdm",
    "scipy",
    "pyfstat",
    "lalsuite[lalpulsar]==7.26.16",
    "matplotlib",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "jaxtyping>=0.3.7",
]

[project.scripts]
paws = "paws.cli:main"

[project.urls]
Repository = "https://github.com/damondmc/paws"

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paws"]

[tool.ruff]
exclude = ["example/"]

[tool.ruff.lint]
select = ["I", "F"]  # import order, pyflakes (undefined / unused names)
# jaxtyping dimension strings are not forward annotations: "n_candidate 2" is F722, and a single name is written
# with a leading space (" n_candidate") so that it is F722 too instead of an undefined name (F821)
ignore = ["F722"]

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "ruff==0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
